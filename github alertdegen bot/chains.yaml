# Multi-Chain Configuration for EVM NFT Mint Velocity Radar & Alert Bot
# Each chain runs an isolated async WebSocket log listener with independent
# reconnect backoff, confirmation depth, explorer adapter, and alert thresholds.

chains:
  ethereum:
    name: "Ethereum"
    chain_id: 1
    mode: "websocket"
    ws_rpc_env: "ETH_WS_RPC_URL"
    ws_rpc_default: "wss://ethereum-rpc.publicnode.com"
    http_rpc_url: "https://ethereum-rpc.publicnode.com"
    native_token_symbol: "ETH"
    explorer_name: "Etherscan"
    explorer_base_url: "https://etherscan.io"
    explorer_api_type: "etherscan_v2"
    explorer_family: "etherscan"
    explorer_type: "etherscan"
    explorer_url: "https://etherscan.io"
    explorer_api_base_url: "https://api.etherscan.io/v2/api"
    explorer_api_key_env: "ETHERSCAN_API_KEY"
    blockscout_fallback_url: "https://eth.blockscout.com"
    opensea_chain_slug: "ethereum"
    confirmation_depth: 1
    poll_interval_seconds: 2.0
    log_batch_size: 50
    mint_threshold: 15
    min_mints: 15
    window: 300
    cooldown: 1800
    max_contract_age_hours: 72
    alert_on_old_contracts: false
    live_mint_max_minutes: 10.0
    slowing_mint_max_minutes: 30.0
    watchdog_timeout_seconds: 60

